<!DOCTYPE html>
<html>
<head>
    <title>Library Books</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>📚 Library Books</h1>

<a href="/add_book">➕ Add Book</a>

<table>
    <tr>
        <th>Book ID</th>
        <th>Book Name</th>
        <th>Author</th>
        <th>Actions</th>
    </tr>

    {% for book in books %}
    <tr>
        <td>{{ book['id'] }}</td>
        <td>{{ book['name'] }}</td>
        <td>{{ book['author'] }}</td>
        <td>
            <a href="/update_book/{{ book['id'] }}">Update</a>
            <a href="/delete_book/{{ book['id'] }}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

<br>

<a href="/">🏠 Back to Home</a>

<footer>
    <p>Library Management System</p>
    <p>Developed using Python Flask, HTML, CSS and SQLite</p>
</footer>

</body>
</html>
