<!DOCTYPE html>
<html>
<head>
    <title>Add Book - Library Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>➕ Add New Book</h1>

<form method="POST">

    <label>Book ID:</label>
    <input type="number" name="book_id" placeholder="Enter Book ID" required>
    <br><br>

    <label>Book Name:</label>
    <input type="text" name="book_name" placeholder="Enter Book Name" required>
    <br><br>

    <label>Author Name:</label>
    <input type="text" name="author_name" placeholder="Enter Author Name" required>
    <br><br>

    <button type="submit">Add Book</button>

</form>

<a href="/books">📚 View Books</a>
<a href="/">🏠 Back to Home</a>

<footer>
    <p>Library Management System</p>
    <p>Developed using Python Flask, HTML, CSS and SQLite</p>
</footer>

</body>
</html>
