<!DOCTYPE html>
<html>
<head>
    <title>Update Book</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>✏️ Update Book</h1>

<form method="POST">

    <label>Book Name:</label>
    <input type="text" name="book_name" value="{{ book['name'] }}" required>
    <br><br>

    <label>Author Name:</label>
    <input type="text" name="author_name" value="{{ book['author'] }}" required>
    <br><br>

    <button type="submit">Update Book</button>

</form>

<a href="/books">📚 Back to Books</a>
<a href="/">🏠 Back to Home</a>

<footer>
    <p>Library Management System</p>
    <p>Developed using Python Flask, HTML, CSS and SQLite</p>
</footer>

</body>
</html>
